name: Android verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --coverage

      - name: Apply compatible dependency security updates
        run: npm audit fix --no-fund || true

      - name: Generate dependency audit report
        if: always()
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE' | tee -a "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          const v = report.metadata?.vulnerabilities ?? {};
          console.log('## Dependency audit');
          console.log(`Vulnerabilities: ${v.total ?? 'unknown'} total; ${v.high ?? 'unknown'} high; ${v.critical ?? 'unknown'} critical.`);
          if ((v.high ?? 0) > 0 || (v.critical ?? 0) > 0) {
            console.log('::warning::Unresolved dependency vulnerabilities remain; inspect the npm-audit-report artifact before production release.');
          }
          NODE

      - name: Upload dependency audit report
        if: always() && hashFiles('npm-audit.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-dependency-audit
          path: npm-audit.json
          if-no-files-found: warn
          retention-days: 14

      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build release AAB and APK
        run: |
          cd android
          ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Report artifact sizes
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$AAB"
          test -f "$APK"
          node - "$AAB" "$APK" <<'NODE' | tee -a "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          for (const path of process.argv.slice(2)) {
            const bytes = fs.statSync(path).size;
            console.log(`- ${path}: ${bytes} bytes (${(bytes / 1024 / 1024).toFixed(2)} MiB)`);
          }
          NODE

      - name: Upload Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-android-release-aab-debug-signed
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-android-release-apk-debug-signed
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

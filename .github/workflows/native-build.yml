name: Native build verification
on:
  workflow_dispatch:
jobs:
  android-release-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install
      - run: npx expo prebuild --platform android --non-interactive
      - name: Build Android release bundle
        run: cd android && ./gradlew bundleRelease
      - name: Report bundle size
        run: du -h android/app/build/outputs/bundle/release/*.aab
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-bundle-unsigned
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
  ios-release-simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx expo prebuild --platform ios --non-interactive
      - name: Build iOS Release for Simulator
        shell: bash
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          SCHEME=$(xcodebuild -list -json -workspace "$WORKSPACE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).workspace.schemes[0]))")
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
          find ios/build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' -exec du -sh {} \;
